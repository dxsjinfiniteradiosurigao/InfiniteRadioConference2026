<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Radio Conference 2026 — Program</title>
<style>
  :root {
    color-scheme: dark;
    --blue: #1a3cff;
    --blue-light: #4d7bff;
    --red: #d4001f;
    --red-light: #ff3b4e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    color: #fff;
    background: #0a0a14;
    position: relative;
    padding: 28px 16px 60px;
  }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 15% 15%, rgba(26,60,255,0.5), transparent 45%),
      radial-gradient(circle at 85% 25%, rgba(212,0,31,0.45), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(26,60,255,0.35), transparent 50%),
      linear-gradient(135deg, #050510 0%, #0a0a1c 50%, #100508 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 100% 100%;
    animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
    100% { background-position: 100% 100%, 0% 100%, 50% 0%, 0 0; }
  }

  .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  header img { width: 100%; max-width: 260px; margin: 0 auto 10px; display: block; filter: drop-shadow(0 4px 18px rgba(0,0,0,0.5)); }
  header h1 {
    font-size: 1.3rem; letter-spacing: 0.08em; font-weight: 800;
    background: linear-gradient(90deg, var(--blue-light), #ffffff 45%, var(--red-light));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { opacity: .6; font-size: .82rem; margin-top: 6px; }

  .tabs {
    display: flex; gap: 8px; justify-content: center; margin: 22px 0 20px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 10px 20px; border-radius: 999px; cursor: pointer;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.18);
    font-weight: 700; font-size: .88rem; letter-spacing: .03em;
    transition: all .25s;
    position: relative;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--blue), var(--blue-light), var(--red));
    border-color: transparent;
    box-shadow: 0 4px 18px rgba(26,60,255,0.35), 0 4px 18px rgba(212,0,31,0.2);
  }
  .tab .live-dot {
    display: none;
    width: 7px; height: 7px; border-radius: 50%;
    background: #6bffb0; margin-left: 6px;
    box-shadow: 0 0 8px #6bffb0;
    animation: pulse 1.4s infinite;
  }
  .tab.is-today .live-dot { display: inline-block; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(1.3); }
  }

  .day-panel { display: none; animation: fadein .35s ease; }
  .day-panel.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }

  .day-head {
    text-align: center; margin-bottom: 20px;
  }
  .day-head .theme {
    display: inline-block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 800; padding: 6px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #cfe0ff; margin-bottom: 8px;
  }
  .day-head h2 { font-size: 1.25rem; font-weight: 800; }
  .day-head .date { opacity: .55; font-size: .8rem; margin-top: 4px; }

  .items { display: flex; flex-direction: column; gap: 12px; }

  .item {
    display: flex; gap: 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 16px 18px;
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    transition: transform .2s;

    /* scroll-reveal starting state */
    opacity: 0;
    transform: translateY(28px);
  }
  .item.reveal {
    animation: revealIn .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes revealIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .item.current {
    position: relative;
    border: 1px solid rgba(107,255,176,0.6);
    background: rgba(107,255,176,0.08);
    box-shadow: 0 0 0 1px rgba(107,255,176,0.25), 0 0 28px rgba(107,255,176,0.25);
    animation: glow 2.2s ease-in-out infinite, currentPulse 2.2s ease-in-out infinite;
    overflow: hidden;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(107,255,176,0.25), 0 0 20px rgba(107,255,176,0.2); }
    50% { box-shadow: 0 0 0 1px rgba(107,255,176,0.45), 0 0 34px rgba(107,255,176,0.4); }
  }
  @keyframes currentPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.012); }
  }
  /* animated sheen sweeping across the highlighted card */
  .item.current::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(107,255,176,0.18), transparent);
    animation: sheen 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sheen {
    0%   { left: -60%; }
    100% { left: 130%; }
  }


  .time-col {
    flex-shrink: 0; width: 92px;
    font-size: .74rem; font-weight: 800; color: var(--blue-light);
    line-height: 1.3; padding-top: 2px;
  }
  .item.current .time-col { color: #6bffb0; }

  .content-col { flex: 1; min-width: 0; }
  .content-col .title { font-size: .98rem; font-weight: 700; line-height: 1.35; }

  .now-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: .65rem; font-weight: 800; letter-spacing: .08em;
    color: #6bffb0; background: rgba(107,255,176,0.12);
    border: 1px solid rgba(107,255,176,0.4);
    padding: 2px 8px; border-radius: 999px; margin-bottom: 6px;
  }
  .now-badge .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #6bffb0;
    animation: pulse 1.4s infinite;
  }

  .speaker-chip {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px; padding: 8px 12px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(26,60,255,0.18), rgba(212,0,31,0.18));
    border: 1px solid rgba(255,255,255,0.2);
  }
  .speaker-chip .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; font-weight: 800;
    background: linear-gradient(135deg, var(--blue), var(--red));
  }
  .speaker-chip .info b { display: block; font-size: .85rem; }
  .speaker-chip .info small { opacity: .7; font-size: .72rem; }

  .details {
    margin-top: 10px; padding-left: 16px; display: flex; flex-direction: column; gap: 3px;
  }
  .details li { font-size: .8rem; opacity: .75; list-style: disc; line-height: 1.4; }

  footer { text-align: center; margin-top: 30px; opacity: .4; font-size: .72rem; }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }
  .team-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 26px 20px;
    text-align: center;
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;

    opacity: 0;
    transform: translateY(28px);
  }
  .team-card.reveal { animation: revealIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .team-avatar {
    width: 110px; height: 110px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 800;
    background: linear-gradient(135deg, var(--blue), var(--red));
    overflow: hidden;
  }
  .team-avatar img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  .team-role {
    font-size: .74rem; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 800; color: #cfe0ff; opacity: .85;
  }
  .team-name { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }

  .contact-list { display: flex; flex-direction: column; gap: 12px; }
  .contact-link {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 16px 18px;
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    text-decoration: none;
    color: #fff;
    transition: transform .2s, border-color .2s;

    opacity: 0;
    transform: translateY(28px);
  }
  .contact-link.reveal { animation: revealIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .contact-link:hover, .contact-link:focus-visible {
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-2px);
  }
  .contact-icon {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem;
    background: linear-gradient(135deg, var(--blue), var(--red));
  }
  .contact-body { flex: 1; min-width: 0; }
  .contact-label {
    font-size: .66rem; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 800; color: #cfe0ff; opacity: .85;
  }
  .contact-value {
    font-size: .95rem; font-weight: 700; word-break: break-word;
  }
</style>
</head>

function initials(str) {
  return str.split(' ').map(w => w[0] || '').join('').slice(0,2).toUpperCase();
}

function teamInitials(str) {
  const clean = str.replace(/[\u201c\u201d"][^\u201c\u201d"]*[\u201c\u201d"]/g, '').replace(/\s+/g, ' ').trim();
  const parts = clean.split(' ').filter(Boolean);
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
  return (first + last).toUpperCase();
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

function getNow() {
  return new Date();
}

function findCurrent(day) {
  const now = getNow();
  const todayStr = now.toISOString().slice(0,10);
  if (todayStr !== day.date) return -1;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let currentIdx = -1;
  day.items.forEach((item, i) => {
    const s = toMinutes(item.start);
    let e = toMinutes(item.end);
    if (e <= s) e = s + 1; // point-in-time entries still highlight briefly
    if (nowMin >= s && nowMin < e) currentIdx = i;
  });
  return currentIdx;
}

function isToday(day) {
  const now = getNow();
  return now.toISOString().slice(0,10) === day.date;
}

function renderItem(item, isCurrent, idx) {
  let html = '<div class="item' + (isCurrent ? ' current' : '') + '" data-idx="' + idx + '">';
  html += '<div class="time-col">' + item.label + '</div>';
  html += '<div class="content-col">';
  if (isCurrent) {
    html += '<div class="now-badge"><span class="dot"></span>NOW</div>';
  }
  html += '<div class="title">' + item.title + '</div>';
  if (item.speaker) {
    html += '<div class="speaker-chip">' +
      '<div class="avatar">' + initials(item.speaker) + '</div>' +
      '<div class="info"><b>' + item.speaker + '</b><small>' + (item.speakerRole || 'Speaker') + '</small></div>' +
    '</div>';
  }
  if (item.details && item.details.length) {
    html += '<ul class="details">' + item.details.map(d => '<li>' + d + '</li>').join('') + '</ul>';
  }
  html += '</div></div>';
  return html;
}

function renderDay(key, day) {
  const currentIdx = findCurrent(day);
  const itemsHtml = day.items.map((item, i) => renderItem(item, i === currentIdx, i)).join('');
  const dateObj = new Date(day.date + 'T00:00:00');
  const dateStr = dateObj.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  return (
    '<div class="day-panel" id="panel-' + key + '">' +
      '<div class="day-head">' +
        '<div class="theme">' + day.theme + '</div>' +
        '<h2>' + day.label + ' — ' + day.title + '</h2>' +
        '<div class="date">' + dateStr + '</div>' +
      '</div>' +
      '<div class="items">' + itemsHtml + '</div>' +
    '</div>'
  );
}

function renderTeamPanel() {
  const cardsHtml = TEAM.map((p, i) => {
    const avatarInner = p.photo
      ? '<img src="' + p.photo + '" alt="' + p.name + '" draggable="false" oncontextmenu="return false;">'
      : teamInitials(p.name);
    return '<div class="team-card" data-idx="' + i + '">' +
      '<div class="team-avatar">' + avatarInner + '</div>' +
      '<div class="team-role">' + p.role + '</div>' +
      '<div class="team-name">' + p.name + '</div>' +
    '</div>';
  }).join('');
  return (
    '<div class="day-panel" id="panel-' + TEAM_KEY + '">' +
      '<div class="day-head">' +
        '<div class="theme">Infinite Radio Surigao</div>' +
        '<h2>Behind Infinite Radio</h2>' +
        '<div class="date">The team making DXSJ 93.3 happen</div>' +
      '</div>' +
      '<div class="team-grid">' + cardsHtml + '</div>' +
    '</div>'
  );
}

function renderContactPanel() {
  const linksHtml = CONTACT.map((c, i) =>
    '<a class="contact-link" data-idx="' + i + '" href="' + c.href + '" target="_blank" rel="noopener">' +
      '<div class="contact-icon">' + c.icon + '</div>' +
      '<div class="contact-body">' +
        '<div class="contact-label">' + c.label + '</div>' +
        '<div class="contact-value">' + c.value + '</div>' +
      '</div>' +
    '</a>'
  ).join('');
  return (
    '<div class="day-panel" id="panel-' + CONTACT_KEY + '">' +
      '<div class="day-head">' +
        '<div class="theme">Get In Touch</div>' +
        '<h2>Contact &amp; Socials</h2>' +
        '<div class="date">Reach DXSJ 93.3 Infinite Radio Surigao</div>' +
      '</div>' +
      '<div class="contact-list">' + linksHtml + '</div>' +
    '</div>'
  );
}

function render() {
  const tabItems = dayKeys.map(key => {
    const day = SCHEDULE[key];
    const today = isToday(day);
    return '<div class="tab' + (today ? ' is-today' : '') + '" data-key="' + key + '">' +
      day.label + '<span class="live-dot"></span></div>';
  });
  tabItems.push('<div class="tab" data-key="' + TEAM_KEY + '">Team</div>');
  tabItems.push('<div class="tab" data-key="' + CONTACT_KEY + '">Contact</div>');
  tabsEl.innerHTML = tabItems.join('');

  panelsEl.innerHTML = dayKeys.map(key => renderDay(key, SCHEDULE[key])).join('') + renderTeamPanel() + renderContactPanel();

  let activeKey = dayKeys.find(k => isToday(SCHEDULE[k])) || dayKeys[0];
  setActive(activeKey);

  tabsEl.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => setActive(t.dataset.key));
  });
}

function setActive(key) {
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  panelsEl.querySelectorAll('.day-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
}

// scroll-reveal: fade/slide each visible day's items in as they enter the viewport,
// staggered by their position in the list
let revealObserver = null;
function setupScrollReveal() {
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const idx = Number(el.dataset.idx) || 0;
        el.style.animationDelay = Math.min(idx * 60, 480) + 'ms';
        el.classList.add('reveal');
        revealObserver.unobserve(el);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.day-panel.active .item, .day-panel.active .team-card, .day-panel.active .contact-link').forEach(el => {
    revealObserver.observe(el);
  });
}

render();
setupScrollReveal();
setInterval(() => { render(); setupScrollReveal(); }, 60000); // refresh highlighting every minute

// re-run scroll-reveal whenever the visible day changes, since the newly
// shown panel's items start unrevealed
const _setActive = setActive;
setActive = function(key) {
  _setActive(key);
  setupScrollReveal();
};
</script>
</body>
</html>
