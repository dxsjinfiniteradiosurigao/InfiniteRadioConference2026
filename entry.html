<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the Wheel!</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    background: #0a0a14;
    color: #fff;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,60,255,0.55), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(255,0,40,0.5), transparent 45%),
      radial-gradient(circle at 50% 80%, rgba(0,80,255,0.45), transparent 50%),
      linear-gradient(135deg, #050510 0%, #0a0a1c 50%, #100508 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%, 100% 100%;
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
    100% { background-position: 100% 100%, 0% 100%, 50% 0%, 0 0; }
  }
  .bg::before, .bg::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
  }
  .bg::before {
    width: 420px; height: 420px;
    background: #1a3cff;
    top: -120px; left: -120px;
    animation: float1 10s ease-in-out infinite;
  }
  .bg::after {
    width: 380px; height: 380px;
    background: #d4001f;
    bottom: -100px; right: -100px;
    animation: float2 12s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-50px, -30px) scale(1.1); }
  }

  .particles span {
    position: fixed;
    bottom: -20px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    animation: rise linear infinite;
    z-index: 0;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(20px); opacity: 0; }
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
  }

  .card {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 26px;
    padding: 36px 30px 32px;
    text-align: center;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.3),
      0 0 60px rgba(26,60,255,0.15),
      0 0 60px rgba(212,0,31,0.1);
    animation: pop 0.6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(18px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.12em;
    font-weight: 800;
    margin-bottom: 26px;
    background: linear-gradient(90deg, #4d7bff, #ffffff 45%, #ff3b4e);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255,255,255,0.15);
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  input[type=text], select {
    width: 100%;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 1.05rem;
    outline: none;
    text-align: center;
    text-align-last: center;
    transition: border-color .25s, box-shadow .25s, background .25s;
    appearance: none;
    -webkit-appearance: none;
  }
  select option { color: #111; }
  input[type=text]::placeholder { color: rgba(255,255,255,0.45); }
  input[type=text]:focus, select:focus {
    border-color: #4d7bff;
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 4px rgba(77,123,255,0.25), 0 0 0 8px rgba(212,0,31,0.12);
  }

  button {
    margin-top: 4px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #1a3cff 0%, #4d7bff 45%, #d4001f 100%);
    background-size: 200% 200%;
    color: #fff;
    font-weight: 800;
    letter-spacing: 0.04em;
    font-size: 1.05rem;
    cursor: pointer;
    transition: transform .15s, box-shadow .25s, background-position .4s;
    box-shadow: 0 6px 20px rgba(26,60,255,0.35), 0 6px 20px rgba(212,0,31,0.2);
  }
  button:hover { background-position: 100% 50%; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .msg {
    margin-top: 18px;
    font-size: 1rem;
    min-height: 1.3em;
    font-weight: 600;
  }
  .ok  { color: #6bffb0; text-shadow: 0 0 12px rgba(107,255,176,0.5); }
  .err { color: #ff6b7a; text-shadow: 0 0 12px rgba(255,107,122,0.4); }

  #continueGate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background: rgba(5,5,16,0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #continueGate.show { display: flex; }

  .splash-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .splash-badge {
    position: relative;
    width: 108px;
    height: 108px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
  }
  .splash-badge .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(77,123,255,0.55);
    animation: ringPulse 2.4s ease-out infinite;
  }
  .splash-badge .ring:nth-child(2) { animation-delay: 0.8s; border-color: rgba(212,0,31,0.5); }
  .splash-badge .ring:nth-child(3) { animation-delay: 1.6s; border-color: rgba(77,123,255,0.4); }
  @keyframes ringPulse {
    0%   { transform: scale(0.55); opacity: 0.9; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .splash-core {
    position: relative;
    z-index: 1;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a3cff, #4d7bff 50%, #d4001f);
    background-size: 200% 200%;
    animation: coreShift 3s ease-in-out infinite, coreBeat 1.6s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(77,123,255,0.55), 0 0 50px rgba(212,0,31,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 0.03em;
  }
  @keyframes coreShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes coreBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  .splash-text {
    max-width: 380px;
    font-size: 1.35rem;
    font-weight: 800;
    line-height: 1.5;
    letter-spacing: 0.01em;
    background: linear-gradient(90deg, #4d7bff, #ffffff 45%, #ff3b4e, #4d7bff);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textShine 3.5s linear infinite;
  }
  @keyframes textShine { to { background-position: 300% center; } }

  .splash-sub {
    margin-top: 10px;
    font-size: 0.92rem;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.03em;
  }
  .splash-sub .dots span {
    display: inline-block;
    animation: dotFade 1.4s ease-in-out infinite;
  }
  .splash-sub .dots span:nth-child(2) { animation-delay: 0.2s; }
  .splash-sub .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotFade {
    0%, 100% { opacity: 0.2; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }

  .splash-bar {
    margin-top: 26px;
    width: 220px;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .splash-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, #4d7bff, #ff3b4e);
    animation: barFill linear forwards;
  }
  @keyframes barFill { to { width: 100%; } }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="particles" id="particles"></div>

  <div class="wrap">
    <div class="card" id="entryCard">
      <h1>ENTER YOUR NAME</h1>
      <form id="entryForm">
        <input type="text" id="nameInput" placeholder="Your full name" maxlength="60" autocomplete="off" required>
        <select id="stationInput" required>
          <option value="" disabled selected>Select your station</option>
          <option value="INFINITE RADIO - ALAMADA">INFINITE RADIO - ALAMADA</option>
          <option value="AIMCOOP INFINITE RADIO - AURORA">AIMCOOP INFINITE RADIO - AURORA</option>
          <option value="INFINITE RADIO - BISLIG">INFINITE RADIO - BISLIG</option>
          <option value="NONGLADING INFINITE RADIO - BUTUAN">NONGLADING INFINITE RADIO - BUTUAN</option>
          <option value="INFINITE RADIO - CALBAYOG">INFINITE RADIO - CALBAYOG</option>
          <option value="INFINITE RADIO - CLAVER">INFINITE RADIO - CLAVER</option>
          <option value="INFINITE RADIO - DIPOLOG">INFINITE RADIO - DIPOLOG</option>
          <option value="INFINITE RADIO - GENSAN">INFINITE RADIO - GENSAN</option>
          <option value="INFINITE RADIO - IPIL">INFINITE RADIO - IPIL</option>
          <option value="INFINITE RADIO - ISULAN">INFINITE RADIO - ISULAN</option>
          <option value="INFINITE RADIO - JAGNA">INFINITE RADIO - JAGNA</option>
          <option value="INFINITE RADIO - KIDAPAWAN">INFINITE RADIO - KIDAPAWAN</option>
          <option value="INFINITE RADIO - LIPA">INFINITE RADIO - LIPA</option>
          <option value="INFINITE RADIO - MATI">INFINITE RADIO - MATI</option>
          <option value="PARTNER RADIO - OROQUIETA">PARTNER RADIO - OROQUIETA</option>
          <option value="INFINITE RADIO - PANABO">INFINITE RADIO - PANABO</option>
          <option value="NONGLADING INFINITE RADIO - SAN FRANCISCO">NONGLADING INFINITE RADIO - SAN FRANCISCO</option>
          <option value="INFINITE RADIO - SUGBONGCOGON">INFINITE RADIO - SUGBONGCOGON</option>
          <option value="INFINITE RADIO - SURIGAO">INFINITE RADIO - SURIGAO</option>
          <option value="INFINITE RADIO - TANDAG">INFINITE RADIO - TANDAG</option>
          <option value="INFINITE RADIO - VALENCIA">INFINITE RADIO - VALENCIA</option>
          <option value="INFINITE RADIO - VILLABA">INFINITE RADIO - VILLABA</option>
        </select>
        <button type="submit" id="submitBtn">Enter</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div id="continueGate">
    <div class="splash-wrap">
      <div class="splash-badge">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="splash-core">IR</div>
      </div>
      <div class="splash-text">Welcome to Infinite Radio Conference 2026</div>
      <div class="splash-sub">Loading your program<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
      <div class="splash-bar"><div class="splash-bar-fill" id="splashBarFill"></div></div>
    </div>
  </div>

<script>
/* ===================== EDIT THIS ===================== *
 * Paste your Apps Script Web App URL here (ends in /exec).
 * ======================================================= */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlg8D9idFdK5scrpGuCPkiHPeHoXDfO9YE6xrcYdaZLCTnraXFGtVbOxnyIoubxrtR/exec';

var PROGRAM_URL = 'https://dxsjinfiniteradiosurigao.github.io/InfiniteRadioConference2026/';
var DEVICE_KEY = 'infiniteRadioWheelEntrySubmitted';
var DEVICE_NAME_KEY = 'infiniteRadioWheelEntryName';

// gentle rising particles
(function() {
  var container = document.getElementById('particles');
  var count = 22;
  for (var i = 0; i < count; i++) {
    var s = document.createElement('span');
    s.style.left = Math.random() * 100 + 'vw';
    var duration = 8 + Math.random() * 10;
    var delay = Math.random() * 10;
    s.style.animationDuration = duration + 's';
    s.style.animationDelay = delay + 's';
    var size = 3 + Math.random() * 5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.background = Math.random() > 0.5 ? 'rgba(77,123,255,0.5)' : 'rgba(212,0,31,0.5)';
    container.appendChild(s);
  }
})();

var form = document.getElementById('entryForm');
var input = document.getElementById('nameInput');
var stationInput = document.getElementById('stationInput');
var btn = document.getElementById('submitBtn');
var msg = document.getElementById('msg');
var continueGate = document.getElementById('continueGate');
var SPLASH_DELAY_MS = 1800; // how long the splash shows before redirecting

// This page is served directly by GitHub Pages (not embedded in any
// sandboxed iframe), so a plain top-level navigation always works --
// no window.top tricks or user click needed.
function goToProgram() {
  window.location.href = PROGRAM_URL;
}

function showContinueGate() {
  continueGate.classList.add('show');
  var fill = document.getElementById('splashBarFill');
  fill.style.animationDuration = SPLASH_DELAY_MS + 'ms';
  setTimeout(goToProgram, SPLASH_DELAY_MS);
}

if (localStorage.getItem(DEVICE_KEY)) {
  showContinueGate();
}

form.addEventListener('submit', function(e) {
  e.preventDefault();
  var name = input.value.trim();
  var station = stationInput.value;
  if (!name) return;
  if (!station) {
    msg.textContent = 'Please enter your station.';
    msg.className = 'msg err';
    return;
  }
  btn.disabled = true;
  msg.textContent = 'Submitting...';
  msg.className = 'msg';

  // Apps Script doesn't send CORS headers, so this is a "no-cors"
  // fetch: the browser can't read the response, but the POST still
  // reaches doPost() and writes the row to the Sheet. We just proceed
  // optimistically after it's sent.
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ name: name, station: station })
  })
    .then(function() {
      localStorage.setItem(DEVICE_KEY, '1');
      localStorage.setItem(DEVICE_NAME_KEY, name);
      showContinueGate();
    })
    .catch(function() {
      msg.textContent = 'Something went wrong, please try again.';
      msg.className = 'msg err';
      btn.disabled = false;
    });
});
</script>
</body>
</html>
